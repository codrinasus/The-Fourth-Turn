# Optional one-shot Marker parser.
#
# This intentionally runs outside the FastAPI container. Marker pulls heavyweight
# ML/OCR dependencies, so we materialize its output under data/extracted/ and let
# /ingest consume that reproducible artifact.
#
# Markdown parser output:
#   docker compose -f docker-compose.marker.yml run --rm marker data/in/document.pdf --mode fast --output_dir data/extracted/marker --output_format markdown --MarkdownRenderer_paginate_output --disable_ocr
#
# JSON inspection output:
#   docker compose -f docker-compose.marker.yml run --rm marker data/in/document.pdf --mode fast --output_dir data/extracted/marker-json --output_format json --disable_ocr

services:
  marker:
    build:
      context: .
      dockerfile: docker/marker/Dockerfile
    working_dir: /workspace
    environment:
      - TORCH_DEVICE=${TORCH_DEVICE:-cpu}
      - HF_HOME=/workspace/data/extracted/.cache/huggingface
      - TORCH_HOME=/workspace/data/extracted/.cache/torch
    volumes:
      - ./data:/workspace/data
    entrypoint: ["marker_single"]
    command: ["--help"]
