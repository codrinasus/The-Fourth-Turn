[project]
name = "fourth-turn"
version = "0.1.0"
description = "The Fourth Turn - a RAG-over-PDF backend scaffold (ESSIR 2026 hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qdrant-client>=1.11",
    "python-multipart>=0.0.9",
]

# `uv sync` installs these too; `uv sync --no-dev` skips them in the Docker image.
[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
