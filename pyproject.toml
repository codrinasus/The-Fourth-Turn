[project]
name = "fourth-turn"
version = "0.1.0"
description = "The Fourth Turn - a RAG-over-PDF backend scaffold (ESSIR 2026 hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qdrant-client>=1.11",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    # A second, independent read of the PDF. Docling is what we index; pypdf is what we
    # check our own evidence quotes against in app/rag/verbatim.py, so grounding is
    # verified against a different extractor rather than against ourselves.
    "pypdf>=5.0",
]

# `uv sync` installs these too; `uv sync --no-dev` skips them in the Docker image.
[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
